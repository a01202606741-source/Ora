<style>
/* Layout: one centered column, brand mark on top, three full-width link rows. Dark-first, wine accent from the scrubs. */
:root{
  --bg:#141112; --surface:#1f1a1c; --surface-hover:#2a2124; --line:#3a2f33;
  --fg:#f6f1f2; --muted:#b9acb0; --accent:#c2415f;
  --f-brand:'Kaushan Script','Brush Script MT',cursive;
  --f-ar:'Cairo','Segoe UI',Tahoma,sans-serif;
  --f-en:'Inter','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#faf6f6; --surface:#ffffff; --surface-hover:#f3e9eb; --line:#e6d6da;
    --fg:#241a1d; --muted:#6f5d63; --accent:#8e1b33; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#faf6f6; --surface:#ffffff; --surface-hover:#f3e9eb; --line:#e6d6da;
  --fg:#241a1d; --muted:#6f5d63; --accent:#8e1b33; color-scheme:light;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-ar);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:40px 32px;
  display:flex; justify-content:center;
}
main{width:100%; max-width:420px; display:flex; flex-direction:column; gap:28px; min-width:0}
header{text-align:center; display:flex; flex-direction:column; gap:10px}
.brand{font-family:var(--f-brand); font-size:clamp(64px,22vw,88px); line-height:1; color:var(--fg); letter-spacing:.01em}
.sub{font-family:var(--f-ar); font-size:18px; font-weight:500; color:var(--muted); text-wrap:balance}
.rule{width:44px; height:3px; border-radius:2px; background:var(--accent); margin:6px auto 0}
nav{display:flex; flex-direction:column; gap:14px}
a.link{
  display:flex; align-items:center; gap:16px; padding:16px 18px;
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  color:var(--fg); text-decoration:none; min-width:0;
  transition:background .15s, border-color .15s, transform .15s;
}
a.link:hover{background:var(--surface-hover); border-color:var(--accent)}
a.link:active{transform:scale(.985)}
a.link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.ico{flex:0 0 52px; width:52px; height:52px; border-radius:14px; display:grid; place-items:center; background:var(--bg); border:1px solid var(--line)}
.ico svg{width:28px; height:28px; fill:currentColor; display:block}
.txt{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1}
.name{font-family:var(--f-en); font-weight:600; font-size:18px}
.handle{font-family:var(--f-en); font-size:14px; color:var(--muted); overflow-wrap:anywhere}
.arrow{flex:0 0 auto; color:var(--muted); font-size:22px; line-height:1}
footer{text-align:center; font-size:14px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){a.link{transition:none}}
</style>


</head>

  <nav aria-label="Ora social media links">
